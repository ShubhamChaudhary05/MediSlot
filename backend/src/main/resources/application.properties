spring.application.name=medislot-api
server.port=8080

# Allows local development with a non-committed .env file. Environment variables still take precedence.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medislot?sslmode=disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway is the only schema writer. Hibernate must never change a deployed schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=3

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

app.security.jwt-secret=${JWT_SECRET:}
app.security.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:30}
app.security.password-reset-minutes=${PASSWORD_RESET_MINUTES:15}
app.security.password-reset-max-requests=${PASSWORD_RESET_MAX_REQUESTS:3}
app.security.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3000}
app.admin.bootstrap-email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.admin.bootstrap-name=${ADMIN_BOOTSTRAP_NAME:Platform Administrator}

# Email delivery is disabled by default. Set MAIL_MODE=smtp with the MAIL_* values for production,
# or MAIL_MODE=development-file for a local-only reset-link outbox.
app.mail.mode=${MAIL_MODE:disabled}
app.mail.reset-url=${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
app.mail.development-outbox=${DEV_RESET_OUTBOX_PATH:.dev-reset-emails}
app.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
